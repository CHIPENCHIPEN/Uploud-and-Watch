<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відео Плеєр за посиланням</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        input:focus {
            border-color: #007bff;
        }
        button {
            padding: 12px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        #player-container {
            margin-top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        iframe {
            width: 100%;
            height: 315px;
            border: none;
            border-radius: 8px;
        }
        .error {
            color: red;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Встав посилання на відео</h2>
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/... або TikTok">
        <button onclick="loadVideo()">Завантажити відео</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <div id="player-container"></div>

    <script>
        function loadVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const playerContainer = document.getElementById('player-container');
            const errorMsg = document.getElementById('errorMsg');
            
            playerContainer.innerHTML = '';
            errorMsg.innerHTML = '';

            if (!url) {
                errorMsg.innerHTML = 'Будь ласка, введи посилання!';
                return;
            }

            let embedHtml = '';

            // Перевірка на YouTube (працює для звичайних посилань та shorts)
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('shorts/')) {
                    videoId = url.split('shorts/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                }

                if (videoId) {
                    embedHtml = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                }
            } 
            // Перевірка на TikTok
            else if (url.includes('tiktok.com')) {
                // Витягуємо ID відео з посилання TikTok (наприклад /video/7123456789)
                const match = url.match(/\/video\/(\d+)/);
                if (match && match[1]) {
                    const videoId = match[1];
                    // TikTok має офіційний вбудований плеєр через iframe
                    embedHtml = `<iframe src="https://www.tiktok.com/embed/v2/${videoId}" style="height: 580px;" allowfullscreen></iframe>`;
                }
            }

            if (embedHtml) {
                playerContainer.innerHTML = embedHtml;
            } else {
                errorMsg.innerHTML = 'Не вдалося розпізнати посилання. Перевір, чи це коректний YouTube або TikTok.';
            }
        }
    </script>

</body>
</html>
